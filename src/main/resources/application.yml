spring:
  profiles:
    active: local
  application:
    name: bitgram-backend
    config:
      import: optional:classpath:application-secret.yml
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:5431/bitgram
    username: postgres
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
