spring:
  config:
    import: optional:classpath:application-secret.yml
  profiles:
    active: local
  application:
    name: bitgram-backend
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:5431/bitgram
    username: postgres
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update # 변경된 부분만 DB에 반영
    show-sql: true # 실행되는 SQL 눈으로 확인
    properties:
      hibernate:
        format_sql: true # SQL 예쁘게 출력
        dialect: org.hibernate.dialect.PostgreSQLDialect
jwt:
      header: Authorization